name: Feature request
description: Suggest something new for the simulator
labels: ["enhancement"]
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing or annoying?
      description: What can't you do today, or what's harder than it should be?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your idea for how this could work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered (optional)
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched [existing issues](https://github.com/xarc/aeris/issues) and didn't find this one already suggested.
          required: true
