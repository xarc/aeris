name: Deploy AERIS Develop

on:
  push:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Build Angular app for develop preview
        run: npm install && npm run build:dev

      - name: Deploy to GitHub Pages Develop
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/aeris/browser
          branch: prod
          target-folder: develop
          token: ${{ secrets.GIT_TOKEN }}
